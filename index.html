<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Acesso Exclusivo - Xit Grátis</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body {
            background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Inter', sans-serif;
            color: white;
        }
        .glass-card {
            background: rgba(30, 41, 59, 0.7);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
        }
        .btn-primary {
            background: linear-gradient(90deg, #3b82f6 0%, #2563eb 100%);
            transition: all 0.3s ease;
        }
        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 15px -3px rgba(59, 130, 246, 0.5);
        }
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.8);
            z-index: 50;
            align-items: center;
            justify-content: center;
        }
        .modal.active {
            display: flex;
        }
    </style>
</head>
<body>
    <div class="container mx-auto px-4">
        <div class="glass-card max-w-md mx-auto rounded-3xl p-8 text-center">
            <div class="mb-6">
                <div class="w-20 h-20 bg-blue-600 rounded-full flex items-center justify-center mx-auto mb-4 shadow-lg shadow-blue-500/20">
                    <i class="fas fa-shield-alt text-3xl"></i>
                </div>
                <h1 class="text-3xl font-bold mb-2">Xit Grátis</h1>
                <p class="text-slate-400">Clique no botão abaixo para obter sua chave de acesso e link de ativação.</p>
            </div>

            <button onclick="openModal()" class="btn-primary w-full py-4 rounded-xl font-bold text-lg flex items-center justify-center gap-2 mb-4">
                <i class="fas fa-key"></i>
                Pegar Chave de Acesso
            </button>
            
            <p class="text-xs text-slate-500">Ao acessar, você concorda com nossos termos de uso.</p>
        </div>
    </div>

    <!-- Modal -->
    <div id="accessModal" class="modal px-4">
        <div class="glass-card max-w-sm w-full rounded-2xl p-6 relative">
            <button onclick="closeModal()" class="absolute top-4 right-4 text-slate-400 hover:text-white">
                <i class="fas fa-times text-xl"></i>
            </button>
            
            <h2 class="text-xl font-bold mb-6 text-center">Suas Informações</h2>
            
            <div class="space-y-4">
                <div>
                    <label class="block text-sm text-slate-400 mb-1">Chave de Acesso</label>
                    <div class="bg-slate-900/50 p-3 rounded-lg border border-slate-700 flex items-center justify-between">
                        <code id="keyDisplay" class="text-blue-400 font-mono">AGUARDANDO_CHAVE</code>
                        <button onclick="copyText('keyDisplay')" class="text-slate-400 hover:text-blue-400">
                            <i class="fas fa-copy"></i>
                        </button>
                    </div>
                </div>
                
                <div>
                    <label class="block text-sm text-slate-400 mb-1">Link de Ativação</label>
                    <a id="activationLink" href="#" target="_blank" class="bg-blue-600/20 text-blue-400 p-3 rounded-lg border border-blue-500/30 flex items-center justify-between hover:bg-blue-600/30 transition-colors">
                        <span class="truncate">Clique para ativar</span>
                        <i class="fas fa-external-link-alt text-sm"></i>
                    </a>
                </div>
            </div>
            
            <div class="mt-8">
                <button onclick="closeModal()" class="w-full bg-slate-700 hover:bg-slate-600 py-3 rounded-lg font-semibold transition-colors">
                    Fechar
                </button>
            </div>
        </div>
    </div>

    <script>
        // Configurações (Substitua pelos valores reais se desejar)
        const ACCESS_KEY = "V8EM-5ARX-XW8E";
        const ACTIVATION_URL = "https://freefireproxy.com.br/ativar";

        function openModal() {
            document.getElementById('keyDisplay').innerText = ACCESS_KEY;
            document.getElementById('activationLink').href = ACTIVATION_URL;
            document.getElementById('accessModal').classList.add('active');
        }

        function closeModal() {
            document.getElementById('accessModal').classList.remove('active');
        }

        function copyText(elementId) {
            const text = document.getElementById(elementId).innerText;
            navigator.clipboard.writeText(text).then(() => {
                alert('Chave copiada com sucesso!');
            });
        }

        // Fechar modal ao clicar fora
        window.onclick = function(event) {
            const modal = document.getElementById('accessModal');
            if (event.target == modal) {
                closeModal();
            }
        }
    </script>
</body>
</html>
